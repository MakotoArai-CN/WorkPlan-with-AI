name: Linux Portable

on:
  workflow_dispatch:
    inputs:
      upload-to-release:
        description: Attach to the existing published VERSION release
        type: boolean
        default: false

permissions:
  contents: read


jobs:
  build-portable:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Build native Linux binary (no bundled libs)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}
        run: bunx tauri build --no-bundle

      - name: Create portable tarball
        run: bash packaging/create-linux-portable.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: |
            portable-assets/*.tar.gz
            portable-assets/*.sha256
          if-no-files-found: error

  attach-manual-archive:
    if: inputs.upload-to-release == true
    needs: build-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: portable-assets
      - name: Attach to an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-portable.outputs.version }}
        run: |
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "v${VERSION}" portable-assets/* --repo "$GITHUB_REPOSITORY"
