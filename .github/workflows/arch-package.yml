name: Arch Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_OUTPUT

      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo curl
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Sync PKGBUILD to the published release asset
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/WorkPlan_${version}_linux-x86_64.tar.gz"
          sum="$(curl -fsSL "${url}.sha256" | awk '{print $1}')"
          test -n "$sum"
          echo "pinning PKGBUILD to ${version} (${sum})"
          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${sum}')/" packaging/arch/PKGBUILD

      - name: Build Arch package
        run: |
          chown -R builder:builder .
          cd packaging/arch
          sudo -u builder makepkg -s --noconfirm

      - name: Verify package dependencies
        run: |
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          missing=$(ldd /usr/bin/workplan | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            exit 1
          fi

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: packaging/arch/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
