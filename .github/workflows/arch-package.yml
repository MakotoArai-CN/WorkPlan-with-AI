name: Arch Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_OUTPUT

      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build Arch package
        run: |
          chown -R builder:builder .
          cd packaging/arch
          sudo -u builder makepkg -s --noconfirm

      - name: Verify package dependencies
        run: |
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          missing=$(ldd /usr/bin/workplan | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            exit 1
          fi

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: packaging/arch/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
