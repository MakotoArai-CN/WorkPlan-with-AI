name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  G4F_DEV_REPOSITORY: MakotoArai-CN/g4f.dev
  G4F_DEV_REF: d9de8c2c5691a8e21b2d6fc60e7f38ae9a2382d0

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  get-version:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Validate bundled G4F assets
        run: |
          test -f g4f.dev/dist/js/providers.json || { echo "Missing g4f.dev/dist/js/providers.json"; exit 1; }
          test -f g4f.dev/dist/js/client.js || { echo "Missing g4f.dev/dist/js/client.js"; exit 1; }
          test -f g4f.dev/dist/js/model.js || { echo "Missing g4f.dev/dist/js/model.js"; exit 1; }

      - name: Get version from VERSION
        id: get_version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: windows-latest
            target: i686-pc-windows-msvc
            arch: x86
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Nsis {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"),
              (Join-Path $env:ProgramFiles "NSIS\makensis.exe")
            )
            if ($env:ChocolateyInstall) {
              $candidates += (Join-Path $env:ChocolateyInstall "bin\makensis.exe")
            }
            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) { return $candidate }
            }
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            return $null
          }

          $makensis = Find-Nsis
          if (-not $makensis) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Installing NSIS via Chocolatey (attempt $attempt/3)..."
                choco install nsis -y --no-progress --force
              } catch {
                Write-Warning "Chocolatey attempt $attempt failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds (10 * $attempt)
              $makensis = Find-Nsis
              if ($makensis) { break }
            }
          }

          if (-not $makensis) {
            try {
              Write-Host "Falling back to winget for NSIS..."
              winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
              Start-Sleep -Seconds 5
              $makensis = Find-Nsis
            } catch {
              Write-Warning "winget NSIS install failed: $($_.Exception.Message)"
            }
          }

          if (-not $makensis) {
            throw "NSIS installation failed: makensis.exe not found after Chocolatey and winget retries."
          }

          $nsisPath = Split-Path -Parent $makensis
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

  build-windows-webview2:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - uses: actions/checkout@v4

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Nsis {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"),
              (Join-Path $env:ProgramFiles "NSIS\makensis.exe")
            )
            if ($env:ChocolateyInstall) {
              $candidates += (Join-Path $env:ChocolateyInstall "bin\makensis.exe")
            }
            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) { return $candidate }
            }
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            return $null
          }

          $makensis = Find-Nsis
          if (-not $makensis) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Installing NSIS via Chocolatey (attempt $attempt/3)..."
                choco install nsis -y --no-progress --force
              } catch {
                Write-Warning "Chocolatey attempt $attempt failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds (10 * $attempt)
              $makensis = Find-Nsis
              if ($makensis) { break }
            }
          }

          if (-not $makensis) {
            try {
              Write-Host "Falling back to winget for NSIS..."
              winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
              Start-Sleep -Seconds 5
              $makensis = Find-Nsis
            } catch {
              Write-Warning "winget NSIS install failed: $($_.Exception.Message)"
            }
          }

          if (-not $makensis) {
            throw "NSIS installation failed: makensis.exe not found after Chocolatey and winget retries."
          }

          $nsisPath = Split-Path -Parent $makensis
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Modify tauri.conf.json for WebView2 bootstrapper
        shell: powershell
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName "webviewInstallMode" -NotePropertyValue @{ type = "downloadBootstrapper" } -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath
          Write-Host "Modified tauri.conf.json:"
          Get-Content $confPath

      - name: Build with WebView2 bootstrapper
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}
        with:
          args: --bundles nsis

      - name: Collect WebView2 installer
        shell: powershell
        run: |
          $artifactDir = "webview2-artifacts"
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Write-Host "Collecting installers from: $targetDir"

          $installers = @(Get-ChildItem -Path $targetDir -Recurse -File -Filter "*.exe" |
            Where-Object { $_.FullName -like "*\release\bundle\nsis\*" })

          if ($installers.Count -eq 0) {
            Write-Host "Available bundle directories:"
            Get-ChildItem -Path $targetDir -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\bundle*" } |
              ForEach-Object { Write-Host $_.FullName }
            throw "No NSIS installer was generated."
          }

          $installers | ForEach-Object {
            $newName = $_.Name -replace '\.exe$', '-webview2.exe'
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $artifactDir $newName) -Force
          }

      - name: Upload WebView2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-webview2
          path: webview2-artifacts/*.exe
          if-no-files-found: error

  # 离线版本
  build-windows-webview2-offlineInstaller:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - uses: actions/checkout@v4

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Nsis {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"),
              (Join-Path $env:ProgramFiles "NSIS\makensis.exe")
            )
            if ($env:ChocolateyInstall) {
              $candidates += (Join-Path $env:ChocolateyInstall "bin\makensis.exe")
            }
            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) { return $candidate }
            }
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            return $null
          }

          $makensis = Find-Nsis
          if (-not $makensis) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Installing NSIS via Chocolatey (attempt $attempt/3)..."
                choco install nsis -y --no-progress --force
              } catch {
                Write-Warning "Chocolatey attempt $attempt failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds (10 * $attempt)
              $makensis = Find-Nsis
              if ($makensis) { break }
            }
          }

          if (-not $makensis) {
            try {
              Write-Host "Falling back to winget for NSIS..."
              winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
              Start-Sleep -Seconds 5
              $makensis = Find-Nsis
            } catch {
              Write-Warning "winget NSIS install failed: $($_.Exception.Message)"
            }
          }

          if (-not $makensis) {
            throw "NSIS installation failed: makensis.exe not found after Chocolatey and winget retries."
          }

          $nsisPath = Split-Path -Parent $makensis
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Modify tauri.conf.json for WebView2 offlineInstaller
        shell: powershell
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName "webviewInstallMode" -NotePropertyValue @{ type = "offlineInstaller" } -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath
          Write-Host "Modified tauri.conf.json:"
          Get-Content $confPath

      - name: Build with WebView2 offlineInstaller
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}
        with:
          args: --bundles nsis

      - name: Collect WebView2 offlineInstaller
        shell: powershell
        run: |
          $artifactDir = "webview2-offline-artifacts"
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Write-Host "Collecting installers from: $targetDir"

          $installers = @(Get-ChildItem -Path $targetDir -Recurse -File -Filter "*.exe" |
            Where-Object { $_.FullName -like "*\release\bundle\nsis\*" })

          if ($installers.Count -eq 0) {
            Write-Host "Available bundle directories:"
            Get-ChildItem -Path $targetDir -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\bundle*" } |
              ForEach-Object { Write-Host $_.FullName }
            throw "No NSIS installer was generated."
          }

          $installers | ForEach-Object {
            $newName = $_.Name -replace '\.exe$', '-webview2-offlineInstaller.exe'
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $artifactDir $newName) -Force
          }

      - name: Upload WebView2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-webview2-offlineInstaller
          path: webview2-offline-artifacts/*.exe
          if-no-files-found: error

  build-linux:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Configure Linux bundle targets
        run: |
          jq '.bundle.targets = ["deb", "rpm", "appimage"]' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Package native Linux binary without bundled GTK libraries
        run: bash packaging/create-linux-portable.sh

      - name: Upload portable Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: |
            portable-assets/*.tar.gz
            portable-assets/*.sha256
          if-no-files-found: error

  build-arch:
    needs: [get-version, build-linux]
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/arch-package.yml
    with:
      portable-artifact: linux-portable

  build-macos:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-android:
    needs: get-version
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout G4F assets
        uses: actions/checkout@v4
        with:
          repository: ${{ env.G4F_DEV_REPOSITORY }}
          ref: ${{ env.G4F_DEV_REF }}
          path: g4f.dev
          fetch-depth: 1
          sparse-checkout: |
            dist

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Initialize Android project
        run: bun run tauri android init

      - name: Copy Android icons
        run: |
          ANDROID_RES="src-tauri/gen/android/app/src/main/res"
          ICON_SRC="src-tauri/icons/android"
          
          if [ -d "$ICON_SRC" ]; then
            for dir in "$ICON_SRC"/mipmap-*; do
              if [ -d "$dir" ]; then
                dirname=$(basename "$dir")
                mkdir -p "$ANDROID_RES/$dirname"
                cp -rf "$dir"/* "$ANDROID_RES/$dirname/"
              fi
            done
          fi

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/release.jks
          
          cat > src-tauri/gen/android/keystore.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release.jks
          EOF

      - name: Apply custom build.gradle.kts
        run: |
          cat > src-tauri/gen/android/app/build.gradle.kts << 'GRADLE_EOF'
          import java.util.Properties
          import java.io.FileInputStream

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("rust")
          }

          val tauriProperties = Properties().apply {
              val propFile = file("tauri.properties")
              if (propFile.exists()) {
                  propFile.inputStream().use { load(it) }
              }
          }

          android {
              compileSdk = 36
              namespace = "com.makotoarai.workplan"
              defaultConfig {
                  manifestPlaceholders["usesCleartextTraffic"] = "true"
                  applicationId = "com.makotoarai.workplan"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = tauriProperties.getProperty("tauri.android.versionCode", "1").toInt()
                  versionName = tauriProperties.getProperty("tauri.android.versionName", "1.0")
              }
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }

                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
              buildTypes {
                  getByName("debug") {
                      manifestPlaceholders["usesCleartextTraffic"] = "true"
                      isDebuggable = true
                      isJniDebuggable = true
                      isMinifyEnabled = false
                      packaging {
                          jniLibs.keepDebugSymbols.add("*/arm64-v8a/*.so")
                          jniLibs.keepDebugSymbols.add("*/armeabi-v7a/*.so")
                          jniLibs.keepDebugSymbols.add("*/x86/*.so")
                          jniLibs.keepDebugSymbols.add("*/x86_64/*.so")
                      }
                  }
                  getByName("release") {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          *fileTree(".") { include("**/*.pro") }
                              .plus(getDefaultProguardFile("proguard-android-optimize.txt"))
                              .toList().toTypedArray()
                      )
                  }
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
              buildFeatures {
                  buildConfig = true
              }
          }

          rust {
              rootDirRel = "../../../"
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.14.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.core:core-splashscreen:1.0.1")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("com.google.android.material:material:1.12.0")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.1.4")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.5.0")
          }

          apply(from = "tauri.build.gradle.kts")
          GRADLE_EOF

      - name: Build Android APK
        run: bun run tauri android build --split-per-abi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}

      - name: Build Universal APK
        run: bun run tauri android build
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_TABLE: ${{ secrets.VITE_SUPABASE_TABLE }}

      - name: Collect and rename APKs
        run: |
          mkdir -p android-apks
          find src-tauri/gen/android -path "*/release/*.apk" -type f | while read apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64"* ]]; then
              cp "$apk" "android-apks/workplan-android-arm64.apk"
            elif [[ "$filename" == *"arm"* ]]; then
              cp "$apk" "android-apks/workplan-android-arm.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" "android-apks/workplan-android-x86_64.apk"
            elif [[ "$filename" == *"x86"* ]] && [[ "$filename" != *"x86_64"* ]]; then
              cp "$apk" "android-apks/workplan-android-x86.apk"
            elif [[ "$filename" == *"universal"* ]] || [[ "$filename" != *"-"* ]]; then
              cp "$apk" "android-apks/workplan-android-universal.apk"
            fi
          done
          ls -la android-apks/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android-apks/*.apk

  release:
    needs: [get-version, build-windows, build-windows-webview2, build-windows-webview2-offlineInstaller, build-linux, build-arch, build-macos, build-android]
    if: needs.get-version.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts found"

      - name: Generate release page and SHA-256 manifest
        run: node packaging/release-notes.mjs artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.apk
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
