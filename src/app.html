<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="color-scheme" content="light dark" />
    <title>WorkPlan with AI</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <script src="%sveltekit.assets%/theme-init.js"></script>
    <script src="%sveltekit.assets%/locale-init.js"></script>
    <link rel="stylesheet" href="%sveltekit.assets%/startup.css" />
    <script src="%sveltekit.assets%/startup.js"></script>
    %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
    <div id="workplan-startup" role="status" aria-live="polite" aria-label="WorkPlan">
        <div class="startup-stage" aria-hidden="true">
            <div class="startup-mark">
                <svg viewBox="0 0 48 48"><path d="M33 10H13a3 3 0 0 0-3 3v22a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3V22" /><path class="startup-check" d="m19 22 7 7 15-18" /></svg>
            </div>
            <div>
                <p class="startup-brand">WorkPlan</p>
                <p class="startup-tagline">Your day, in focus.</p>
                <div class="startup-tracks"><span></span><span></span><span></span></div>
            </div>
        </div>
        <div class="startup-status">
            <p id="workplan-startup-status">Preparing your workspace</p>
            <button id="workplan-startup-retry" type="button" hidden>Reload</button>
            <noscript>JavaScript is required to open WorkPlan.</noscript>
        </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Vditor loads its icon sprite by injecting an inline <script>, which the
         app CSP (script-src 'self') blocks. Preload it as a normal same-origin
         script; Vditor then sees this element id and skips the inline injection. -->
    <script src="%sveltekit.assets%/vendor/vditor/dist/js/icons/material.js" id="vditorIconScript"></script>
</body>
</html>
