<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="color-scheme" content="light dark" />
    <title>WorkPlan with AI</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <script src="%sveltekit.assets%/theme-init.js"></script>
    %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Vditor loads its icon sprite by injecting an inline <script>, which the
         app CSP (script-src 'self') blocks. Preload it as a normal same-origin
         script; Vditor then sees this element id and skips the inline injection. -->
    <script src="%sveltekit.assets%/vendor/vditor/dist/js/icons/material.js" id="vditorIconScript"></script>
</body>
</html>
