<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="0.55" stop-color="#e8f0ff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#f9a8d4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#base)"/>

  <g filter="url(#soften)">
    <ellipse cx="230" cy="140" rx="620" ry="520" fill="url(#blue)"/>
    <ellipse cx="1700" cy="90" rx="640" ry="500" fill="url(#violet)"/>
    <ellipse cx="1520" cy="1080" rx="660" ry="480" fill="url(#cyan)"/>
    <ellipse cx="180" cy="1120" rx="600" ry="440" fill="url(#pink)"/>
    <ellipse cx="980" cy="560" rx="520" ry="380" fill="url(#mint)"/>
  </g>

  <g opacity="0.35">
    <path d="M0 780 C 320 690, 640 880, 980 790 C 1320 700, 1560 860, 1920 760" fill="none" stroke="#ffffff" stroke-width="120" stroke-linecap="round"/>
    <path d="M0 300 C 360 210, 700 380, 1040 300 C 1380 220, 1640 340, 1920 260" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round" opacity="0.6"/>
  </g>
